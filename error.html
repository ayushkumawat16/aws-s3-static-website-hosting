<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(-45deg,#0f172a,#1e3a8a,#4f46e5,#2563eb);
    background-size:400% 400%;
    animation:gradient 12s ease infinite;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:650px;
    text-align:center;
    padding:50px 40px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;

    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.error-code{
    font-size:110px;
    font-weight:800;
    color:#ffffff;
    line-height:1;
}

.error-title{
    margin-top:15px;
    font-size:34px;
    color:#FFD54F;
}

.message{
    margin:25px 0 40px;
    color:#f1f5f9;
    font-size:18px;
    line-height:1.7;
}

.home-btn{
    display:inline-block;
    text-decoration:none;
    padding:16px 34px;
    font-size:17px;
    font-weight:bold;
    color:white;
    border-radius:50px;

    background:linear-gradient(45deg,#ff512f,#dd2476);

    box-shadow:0 10px 25px rgba(221,36,118,.45);

    transition:.35s;
}

.home-btn:hover{
    transform:translateY(-5px) scale(1.05);
    box-shadow:0 18px 35px rgba(221,36,118,.65);
}

.home-btn:active{
    transform:scale(.98);
}

.footer{
    margin-top:35px;
    color:rgba(255,255,255,.7);
    font-size:14px;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    animation:float 8s ease-in-out infinite;
}

.circle.one{
    width:240px;
    height:240px;
    top:-80px;
    left:-80px;
}

.circle.two{
    width:180px;
    height:180px;
    bottom:-60px;
    right:-60px;
}

@keyframes float{
    50%{
        transform:translateY(30px);
    }
}

@media(max-width:600px){

.error-code{
    font-size:80px;
}

.error-title{
    font-size:28px;
}

.message{
    font-size:16px;
}

.container{
    padding:35px 25px;
}

}
</style>

</head>
<body>

<div class="circle one"></div>
<div class="circle two"></div>

<div class="container">

<div class="error-code">404</div>

<h1 class="error-title">Page Not Found</h1>

<p class="message">
Sorry, the page or file you are looking for doesn't exist,
may have been moved, renamed, or is temporarily unavailable.
</p>

<a href="index.html" class="home-btn">
🏠 Return to Home
</a>

<div class="footer">
Error Code: 404 • File Not Found
</div>

</div>

</body>
</html>
